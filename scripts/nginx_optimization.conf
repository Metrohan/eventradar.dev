# tech-event-radar-nginx-config.conf
# Apply this configuration to your Nginx site file (e.g., /etc/nginx/sites-enabled/eventradar.dev)

server {
    # ... existing configuration (listen, server_name, etc.) ...

    # 1. Gzip Compression
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # 2. Cache Control for Static Assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 3. Static SEO Files
    location = /robots.txt {
        root /var/www/seo; # Or your frontend public directory
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        root /var/www/seo; # Or your frontend public directory
        add_header Content-Type application/xml;
    }

    # ... rest of your configuration (proxy_pass, etc.) ...
}
