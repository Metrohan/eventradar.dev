# Original request path without the query string. $uri changes on the
# try_files -> /index.html internal redirect; $request_uri does not.
map $request_uri $seo_orig {
    ~^(?<p>[^?]*) $p;
    default       /;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(events/|etkinlik/[0-9]+$|kategoriler(?:/|$)|sehirler(?:/|$)) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check, proxied so external uptime monitors actually
    # reflect backend health. Without this, /health falls through to the
    # SPA fallback below and returns a false-positive 200 even when the
    # backend is fully down (see docs/runbooks/uptime-monitoring.md).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Scrape-time event thumbnails (see docs/adr/0005-scrape-time-image-resize.md)
    # Filenames are content-addressed by source URL hash and never overwritten,
    # so they're safe to cache the same way as hashed JS/CSS bundles.
    location /media/thumbnails/ {
        proxy_pass http://backend:8000/media/thumbnails/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy URL indexed by Google before the site restructure; redirect
    # instead of soft-404ing through the SPA fallback.
    location = /events {
        return 301 /;
    }

    # Per-URL <head> tags from the backend, included into index.html below (SSI).
    # Internal only. Any backend failure or empty answer makes SSI fall back to the
    # default tags inside index.html (the "seo_default" stub block).
    location ~ ^/_seo(?<seo_path>/.*)$ {
        internal;
        proxy_pass http://backend:8000/api/seo/head$seo_path;
        proxy_set_header Host $host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @seo_empty;
    }

    location @seo_empty {
        default_type text/html;
        return 200 "";
    }

    # Only the SPA shell is processed for SSI directives (never API/backend HTML).
    location = /index.html {
        ssi on;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
