name: Deploy TechEventRadar

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ALLOW_INSECURE_DEFAULTS: "true"
      SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars"
      ADMIN_USERNAME: "testadmin"
      ADMIN_PASSWORD: "testpassword"
      DATABASE_URL: "sqlite:///./test.db"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Check formatting
        run: black --check .
      - name: Lint
        run: pylint app/ --disable=C0114,C0115,C0116,R0903,W0611 --fail-under=7.0
      - name: Run tests
        run: pytest -m "not integration" -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SSH_USERNAME }}/TechEventRadar/

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            PREV_COMMIT="$(git rev-parse HEAD)"

            git fetch --all
            git checkout main
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase failed (local changes or conflict on server) — aborting deploy without rebuilding stale containers."
              git rebase --abort || true
              exit 1
            fi

            $COMPOSE up -d db

            mkdir -p backups
            BACKUP_FILE="backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz"
            $COMPOSE exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' | gzip > "$BACKUP_FILE"
            echo "DB backup: $BACKUP_FILE"
            find backups -name 'pre_deploy_*.sql.gz' -mtime +7 -delete

            $COMPOSE build backend frontend
            $COMPOSE run --rm backend alembic upgrade head
            $COMPOSE up -d --force-recreate

            if ! BASE_URL=http://127.0.0.1:8000 bash scripts/verify_deploy.sh; then
              echo "::error::verify_deploy basarisiz oldu, koda $PREV_COMMIT'e (bir onceki commit) donuluyor."
              echo "::warning::Bu rollback yalnizca kodu/image'i geri aliyor. Yeni migration eski koddan geri alinmiyor (otomatik 'alembic downgrade' calistirilmadi, guvenli olmadigi icin) - gerekirse $BACKUP_FILE dosyasindan DB'yi elle geri yukle: gunzip -c $BACKUP_FILE | docker compose exec -T db psql -U \$POSTGRES_USER -d \$POSTGRES_DB"

              git checkout "$PREV_COMMIT"
              $COMPOSE build backend frontend
              $COMPOSE up -d --force-recreate

              echo "--- Rollback tamamlandi ($PREV_COMMIT'e donuldu). Deploy basarisiz sayiliyor. ---"
              exit 1
            fi

            echo "--- Deploy tamamlandi ---"
