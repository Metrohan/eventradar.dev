name: Update Contributors

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # weekly fallback, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate contributors list (TR README)
        uses: akhilmhdh/contributors-readme-action@1ff4c56187458b34cd602aee93e897344ce34bfc # v2.3.10
        with:
          image_size: 64
          columns_per_row: 6
          readme_path: README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contributors list (EN README)
        uses: akhilmhdh/contributors-readme-action@1ff4c56187458b34cd602aee93e897344ce34bfc # v2.3.10
        with:
          image_size: 64
          columns_per_row: 6
          readme_path: README.en.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git diff --cached --quiet || git commit -m "docs: update contributors list [skip ci]"
          git push
