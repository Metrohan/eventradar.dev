name: Tests & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    # Auto-format only on push to main (trusted); PRs get --check instead
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install black

      - name: Check formatting (PR)
        if: github.event_name == 'pull_request'
        run: black --check .

      - name: Auto-format and push (main)
        if: github.event_name == 'push'
        run: |
          black .
          git diff --exit-code || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/ scripts/ tests/
            git commit -m "style: auto-format with black"
            git push
          )

  test:
    runs-on: ubuntu-latest
    needs: format

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_migration_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ALLOW_INSECURE_DEFAULTS: "true"
      SECRET_KEY: "ci-test-secret-key-that-is-at-least-32-chars"
      ADMIN_USERNAME: "testadmin"
      ADMIN_PASSWORD: "testpassword"
      DATABASE_URL: "sqlite:///./test.db"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (pylint)
        run: pylint app/ --disable=C0114,C0115,C0116,R0903,W0611 --fail-under=7.0

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Security scan (bandit)
        run: bandit -r app/ -ll -q

      - name: Migration smoke test (Postgres)
        env:
          DEBUG: "false"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_migration_db"
        run: |
          alembic upgrade head
          alembic current | grep "(head)"

      - name: Run tests (excluding integration)
        run: pytest -m "not integration" --cov=app --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./coverage.xml
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
